<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Spross 60 Seconds: Fun Math Challenge for Kids</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary-bg: #fafff0; --card-bg: #ffffff; --text-main: #333333;
            --accent-blue: #4a90e2; --accent-green: #1b5e20; --accent-red: #f44336;
            --darkest-green: #0a3d0c; --soft-green: #c8e6c9;
            --color-god: #fff3cd; --color-prof: #d1e7dd; --color-doc: #cfe2ff;
            --color-student: #f8d7da; --color-seed: #e0e0e0;
        }
        body {
            font-family: 'Nanum Gothic', sans-serif; margin: 0; padding: 0;
            background-color: var(--primary-bg); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; touch-action: manipulation;
        }
        #game-box {
            width: 100%; max-width: 480px; min-height: 100dvh; background: var(--card-bg);
            box-shadow: 0 0 20px rgba(0,0,0,0.05); display: flex; flex-direction: column;
            padding: 15px; box-sizing: border-box; position: relative;
        }
        .page { display: none; flex-direction: column; align-items: center; width: 100%; flex-grow: 1; z-index: 1; }
        .active { display: flex !important; }
        h1 { color: var(--accent-green); margin-bottom: 5px; }
        .btn {
            padding: 15px; margin: 8px; border: none; border-radius: 12px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s; width: 90%; position: relative; z-index: 10;
        }
        .btn:active { transform: scale(0.96); }
        .btn-cake { background: #e8f5e9; color: var(--darkest-green); border: 2px solid #a5d6a7; }
        .btn-pepper { background: #fff3e0; color: #ef6c00; border: 2px solid #ffcc80; }
        .btn-volcano { background: #ffebee; color: #c62828; border: 2px solid #ef9a9a; }
        .btn-home { background: #eeeeee; color: #616161; }
        .btn-submit { background: var(--accent-blue); color: white; }
        #game-header { 
            width: 100%; display: flex; justify-content: space-between; align-items: center; 
            font-size: 14px; font-weight: bold; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee;
        }
        #question-display { 
            font-size: 44px; font-weight: 800; margin: 10px 0; min-height: 60px; 
            display: flex; align-items: center; justify-content: center; transition: color 0.2s; line-height: 1.2; width: 100%;
        }
        #q-text { min-width: 160px; text-align: right; padding-right: 15px; }
        #player-input { min-width: 80px; text-align: left; color: var(--accent-blue); padding-left: 15px; }
        #growth-zone, #res-growth-display {
            width: 100%; min-height: 120px; display: flex; flex-direction: column;
            justify-content: center; align-items: center; margin-bottom: 5px; overflow: visible !important; 
            pointer-events: none; position: relative; 
        }
        .growth-row { display: flex; justify-content: center; align-items: center; gap: 2px; min-height: 48px; width: 100%; }
        .growth-item {
            transition: all 0.2s ease-out; display: flex; justify-content: center; align-items: center;
            line-height: 1; width: 26px; animation: twinkle 0.8s ease-in-out forwards; 
        }
        @keyframes dropAnim {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            30% { transform: translateY(-30px) scale(1.2); opacity: 1; }
            100% { transform: translateY(20px) scale(1); opacity: 0; }
        }
        .water-drop { position: absolute; font-size: 10px; z-index: 999; animation: dropAnim 0.7s ease-out forwards; }
        @keyframes sunPulse {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(0deg); opacity: 1; }
            100% { transform: scale(1) rotate(10deg); opacity: 0; }
        }
        .fixed-sun { position: absolute; top: 10px; font-size: 30px; z-index: 998; animation: sunPulse 0.8s ease-out forwards; }
        @keyframes sparkleAnim {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        .sparkle { position: absolute; font-size: 12px; z-index: 999; animation: sparkleAnim 0.6s ease-in-out forwards; }
        @keyframes twinkle {
            0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 0px rgba(255,255,255,0)); }
            50% { opacity: 0.8; transform: scale(1.1); filter: drop-shadow(0 0 8px rgba(255,223,0,0.8)); }
        }
        .confetti { position: absolute; z-index: 1000; pointer-events: none; }
        @keyframes confettiBurst {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
        }
        @keyframes eagleFly {
            0% { transform: translateX(200px); opacity: 0; }
            10%, 90% { opacity: 1; }
            100% { transform: translateX(-200px); opacity: 0; }
        }
        .eagle-anim { animation: eagleFly 2s linear forwards; }
        .wrong { color: var(--accent-red) !important; animation: shake 0.3s; }
        #keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-top: 8px; }
        .key { padding: 18px; background: #f5f5f5; border: none; border-radius: 8px; font-size: 24px; font-weight: bold; cursor: pointer; color: var(--darkest-green); }
        .key-del { background: var(--soft-green); color: var(--darkest-green); font-size: 20px; }
        .key-bs { background: #fdf2b1; font-size: 28px; }
        .home-info { font-size: 12px; color: #666; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-top: 20px; width: 90%; line-height: 1.6; }
        .lv-god { background-color: var(--color-god) !important; }
        .lv-prof { background-color: var(--color-prof) !important; }
        .lv-doc { background-color: var(--color-doc) !important; }
        .lv-student { background-color: var(--color-student) !important; }
        .lv-seed { background-color: var(--color-seed) !important; }
        .my-rank-highlight { outline: 3px solid #FFCC99; outline-offset: -3px; font-weight: 900 !important; }
        #modal-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 100; }
        #modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; text-align: center; }
        
        /* Level System Table Styles */
        .lv-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 11px; table-layout: fixed; }
        .lv-table th, .lv-table td { border: 1px solid #ddd; padding: 6px 2px; text-align: center; }
        .lv-table th { background: #f2f2f2; color: #333; }
        .lv-table tr:nth-child(even) { background: #fafafa; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; } /* 1. Text 크기 1px 축소 (기존 13px) */
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: center; }
        footer { font-size: 11px; color: #cccccc; margin: 5px 0; text-align: center; width: 100%; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .rank-tab-btn { flex: 1; cursor: pointer; padding: 10px; border: 1px solid #ddd; background: #fff; border-radius: 8px; }
        .rank-tab-btn.active-mode { background-color: var(--soft-green) !important; }
    </style>
</head>
<body>
<div id="game-box">
    <div id="page-home" class="page active">
        <h1>🌱 Math Spross 60 Seconds</h1>
        <p>Choose your math garden!</p>
        <button class="btn btn-cake" onclick="initGame('cake')">🍰 Piece of Cake</button>
        <button class="btn btn-pepper" onclick="initGame('pepper')">🌶️ Hot Pepper</button>
        <button class="btn btn-volcano" onclick="initGame('volcano')">🌋 Spicy Volcano</button>
        <button class="btn btn-home" style="margin-top:10px;" onclick="viewRankings()">🏆 Hall of Fame</button>
        <div id="lv-desc-home" class="home-info"></div>
    </div>

    <div id="page-play" class="page">
        <div id="game-header">
            <span class="header-score">✅ <span id="current-score">0</span></span>
            <span class="header-title-mode">🌱 Math spross <span id="display-mode-emoji"></span></span>
            <span class="header-timer">⏱️ <span id="timer">60</span>s</span>
        </div>
        <div id="growth-zone"></div>
        <div id="question-display"><span id="q-text">Ready?</span><span>=</span><span id="player-input"></span></div>
        <div id="keypad">
            <script>
                for(let i=1; i<=9; i++) document.write(`<button class="key" onclick="handleInput(${i})">${i}</button>`);
            </script>
            <button class="key key-bs" onclick="handleInput('del')">←</button>
            <button class="key" onclick="handleInput(0)">0</button>
            <button class="key key-del" onclick="handleInput('clear')">DEL</button>
        </div>
        <div style="display:flex; width:100%; margin-top:10px;">
            <button class="btn btn-home" style="flex:1" onclick="initGame(currentDifficulty)">🔄 Retry</button>
            <button class="btn btn-home" style="flex:1" onclick="showPage('home')">🏠 Home</button>
        </div>
    </div>

    <div id="page-result" class="page">
        <h2 id="res-lv-title"></h2>
        <p id="res-random-msg" style="color: #555; margin: 5px; font-weight: 500;"></p>
        <div id="res-growth-display"></div>
        <p id="res-score-msg" style="font-size: 20px; font-weight: bold; margin-bottom: 8px;"></p>
        <div class="home-info" style="width: 100%; margin-top: 10px; padding: 20px; box-sizing: border-box; text-align: center;">
            <p style="color: #000000; font-weight: bold; margin: 0 0 5px 0;">Welcome to the leader board!</p>
            <p id="res-rank-msg" style="color: #000033; font-weight: bold; font-size: 18px; margin: 0 0 15px 0;"></p>
            <div id="rank-submission" style="width: 100%;">
                <input type="text" id="nickname" placeholder="Nickname" maxlength="12" style="display: block; padding:15px; width:85%; border:1px solid #ddd; border-radius:10px; margin: 0 auto 15px auto; font-size:16px; text-align:center;">
                <div style="display:flex; gap:10px; justify-content:center;">
                    <button class="btn btn-submit" style="margin:0; flex:1;" onclick="pushRank()">Submit</button>
                    <button class="btn btn-home" style="margin:0; flex:1;" onclick="showPage('home')">Home</button>
                </div>
            </div>
        </div>
    </div>

    <div id="page-rank" class="page">
        <h2 id="rank-mode-label">Ranking</h2>
        <div style="display:flex; width:100%; gap:5px; margin-bottom:10px;">
            <button id="btn-rank-cake" class="rank-tab-btn" onclick="viewRankings('cake')">🍰</button>
            <button id="btn-rank-pepper" class="rank-tab-btn" onclick="viewRankings('pepper')">🌶️</button>
            <button id="btn-rank-volcano" class="rank-tab-btn" onclick="viewRankings('volcano')">🌋</button>
        </div>
        <div id="rank-scroll-container" style="width:100%; overflow-y:auto; max-height:280px; border: 1px solid #eee; border-radius: 8px;">
            <table id="rank-table">
                <thead><tr><th>#</th><th>Name</th><th>Score</th><th>Speed</th><th>Date</th></tr></thead>
                <tbody id="rank-list"></tbody>
            </table>
        </div>
        <div id="lv-desc-rank" class="home-info" style="width: 100%; box-sizing: border-box;"></div>
        <button class="btn btn-home" style="margin-top:15px;" onclick="showPage('home')">Home</button>
    </div>

    <div id="modal-overlay">
        <div id="modal-content">
            <h2 id="pop-title">Time Up!</h2>
            <p id="pop-stats"></p>
            <button class="btn btn-submit" style="width:100%; margin-top: 15px;" onclick="goToResult()">Got it</button>
        </div>
    </div>
    <footer>Copyright © 2026 Joyful Spross. All rights reserved.</footer>
</div>

<script>
    // --- 설정 및 데이터 관리 ---
    // 2. DIFF_THRESHOLDS 기준 변경 반영
    const DIFF_THRESHOLDS = {
        cake: { god: 42, prof: 30, doc: 20, student: 12 },
        pepper: { god: 38, prof: 27, doc: 18, student: 11 },
        volcano: { god: 34, prof: 24, doc: 16, student: 10 }
    };

    const LV_DEFS = [
        { id: 'god', name: "God", emoji: "👑", cat: "🙀" },
        { id: 'prof', name: "Prof", emoji: "🎓", cat: "😹" },
        { id: 'doc', name: "Doc", emoji: "🩺", cat: "😻" },
        { id: 'student', name: "Student", emoji: "🌟", cat: "😸" },
        { id: 'seed', name: "Seed", emoji: "👶", cat: null }
    ];

    const firebaseConfig = { apiKey: "AIzaSyAtUbdsfsUpf1ribq8ZWP8TC0j6ZNxB010", authDomain: "math-sprout-60.firebaseapp.com", projectId: "math-sprout-60", storageBucket: "math-sproout-60.firebasestorage.app", messagingSenderId: "792661788916", appId: "1:792661788916:web:d26ea26323cb3389ec76a1", measurementId: "G-2DRXMSFP2P" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const MSG_LIB = {
        god: ["Are you a human calculator? That was incredible!", "Your brain is faster than a rocket ship! 🚀", "The Math King is here!", "Did you just use magic?", "You are 100% a math superhero!", "You finished that like a boss!", "Your brain must be made of super-gold!", "Is there a computer inside your head?", "You just broke the world record!", "Your 'Math Tree' is touching the stars! ⭐"],
        prof: ["Hello, Professor! So smart!", "You solved those like a pro!", "Your brain is working at 1000% speed!", "Wow, you are a genius!", "Logic Power! You found every answer!", "I think you could teach the teacher!", "You have a giant brain!", "Your math skills are totally sparkling! ✨", "Your spross has grown into a strong tree!"],
        doc: ["The Math Doctor is in!", "You have 'Super Eyes'!", "Doctor, you are a genius at counting!", "Your brain is so healthy and strong!", "You cut through those problems masterfully!", "You make math look look so easy!", "Your brain is a math machine!", "A perfect check-up!", "You're getting smarter every second!", "Your spross is blooming! 🌸"],
        student: ["Great job, superstar!", "You’re a math whiz!", "I can see your brain growing!", "You're a star student! 🖐️", "Way to go!", "Your sproout is growing fast!", "You solved so many!", "Smarty pants!", "Keep going! Math master!", "Your sproout just grew a new leaf! 🍃"],
        seed: ["Thirsty sprout! Give it more math water! 💧", "Oops! Brain-battery charging! ⚡", "So close! One more try! 🌱", "Math-Monkeys stole your score! 🐒", "Nice try! Push-ups! 💪"]
    };

    let currentDifficulty = 'cake', timeLeft = 0, timerObj, score = 0, currentAns = 0, inputStr = "", isGameOver = false, isPlaying = false, usedQuestions = [], currentQuestionText = "", mistakeLog = {}, answerTimeout = null, lastPushTs = 0; 

    const getLvData = (s, diff = currentDifficulty) => {
        const t = DIFF_THRESHOLDS[diff];
        if (s >= t.god) return {...LV_DEFS[0], fullName: "Math God", class: "lv-god"};
        if (s >= t.prof) return {...LV_DEFS[1], fullName: "Professor Logic", class: "lv-prof"};
        if (s >= t.doc) return {...LV_DEFS[2], fullName: "Doctor Calculation", class: "lv-doc"};
        if (s >= t.student) return {...LV_DEFS[3], fullName: "Brilliant Student", class: "lv-student"};
        return {...LV_DEFS[4], fullName: "Seed Baby", class: "lv-seed"};
    };

    const updateLvDesc = () => {
        const tableHtml = `
            <b>[Level System Table]</b>
            <table class="lv-table">
                <thead>
                    <tr>
                        <th style="width:25%">Level</th>
                        <th>🍰 Cake</th>
                        <th>🌶️ Pepper</th>
                        <th>🌋 Volcano</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>${LV_DEFS[0].emoji} ${LV_DEFS[0].name}</th>
                        <td>${DIFF_THRESHOLDS.cake.god}+</td>
                        <td>${DIFF_THRESHOLDS.pepper.god}+</td>
                        <td>${DIFF_THRESHOLDS.volcano.god}+</td>
                    </tr>
                    <tr>
                        <th>${LV_DEFS[1].emoji} ${LV_DEFS[1].name}</th>
                        <td>${DIFF_THRESHOLDS.cake.prof}+</td>
                        <td>${DIFF_THRESHOLDS.pepper.prof}+</td>
                        <td>${DIFF_THRESHOLDS.volcano.prof}+</td>
                    </tr>
                    <tr>
                        <th>${LV_DEFS[2].emoji} ${LV_DEFS[2].name}</th>
                        <td>${DIFF_THRESHOLDS.cake.doc}+</td>
                        <td>${DIFF_THRESHOLDS.pepper.doc}+</td>
                        <td>${DIFF_THRESHOLDS.volcano.doc}+</td>
                    </tr>
                    <tr>
                        <th>${LV_DEFS[3].emoji} ${LV_DEFS[3].name}</th>
                        <td>${DIFF_THRESHOLDS.cake.student}+</td>
                        <td>${DIFF_THRESHOLDS.pepper.student}+</td>
                        <td>${DIFF_THRESHOLDS.volcano.student}+</td>
                    </tr>
                    <tr>
                        <th>${LV_DEFS[4].emoji} ${LV_DEFS[4].name}</th>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                    </tr>
                </tbody>
            </table>
            <div style="font-size:11px; margin-top:5px;"><b> Ranking Reset :</b> Every Monday at 09:00 AM KST(UTC+9).</div>
        `;
        document.getElementById('lv-desc-home').innerHTML = tableHtml;
        document.getElementById('lv-desc-rank').innerHTML = tableHtml;
    };
    updateLvDesc();

    function showPage(id) { isPlaying = (id === 'play'); document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('page-' + id).classList.add('active'); window.scrollTo(0, 0); }

    function initGame(mode) {
        currentDifficulty = mode; score = 0; timeLeft = 60; inputStr = ""; isGameOver = false; usedQuestions = []; mistakeLog = {}; lastPushTs = 0;
        if (answerTimeout) clearTimeout(answerTimeout);
        document.getElementById('nickname').value = ""; document.getElementById('current-score').innerText = "0"; document.getElementById('timer').innerText = "60";
        document.getElementById('display-mode-emoji').innerText = { cake: "🍰", pepper: "🌶️", volcano: "🌋" }[mode];
        showPage('play'); updateGrowthZone(); genQuestion();
        clearInterval(timerObj); timerObj = setInterval(() => { if (!isPlaying || isGameOver) return; timeLeft--; document.getElementById('timer').innerText = Math.max(0, timeLeft); if (timeLeft <= 0) stopGame(); }, 1000);
    }

    function genQuestion() {
        let a, b, op, qKey, attempts = 0;
        const diff = currentDifficulty;
        do {
            let r = Math.random();
            if (diff === 'cake') { if (r < 0.5) { do { a = rand(1, 9); b = rand(1, 9); } while (a + b <= 10); currentAns = a + b; op = '+'; } else { do { a = rand(11, 18); b = rand(1, 9); } while (a - b >= 10); currentAns = a - b; op = '-'; }
            } else if (diff === 'pepper') { if (r < 0.5) { do { a = rand(11, 89); b = rand(2, 9); } while ((a % 10) + b < 10); currentAns = a + b; op = '+'; } else { do { a = rand(11, 89); b = rand(2, 9); } while ((a % 10) >= b); currentAns = a - b; op = '-'; }
            } else { if (r < 0.5) { do { a = rand(11, 79); b = rand(11, 89-a); } while ((a % 10) + (b % 10) < 10); currentAns = a + b; op = '+'; } else { do { a = rand(31, 98); b = rand(11, a-1); } while ((a % 10) >= (b % 10)); currentAns = a - b; op = '-'; } }
            qKey = `${a}${op}${b}`;
        } while (usedQuestions.includes(qKey) && attempts++ < 300);
        usedQuestions.push(qKey); currentQuestionText = `${a} ${op} ${b}`;
        document.getElementById('q-text').innerText = currentQuestionText;
        document.getElementById('player-input').innerText = inputStr = "";
    }

    function handleInput(val) {
        if (isGameOver || !isPlaying) return;
        if (answerTimeout) { clearTimeout(answerTimeout); answerTimeout = null; }
        if (val === 'clear') inputStr = ""; else if (val === 'del') inputStr = inputStr.slice(0, -1); else if (inputStr.length < 5) inputStr += val;
        document.getElementById('player-input').innerText = inputStr;
        if (parseInt(inputStr) === currentAns) answerTimeout = setTimeout(checkAnswer, 300);
    }

// 3. 레벨 달성 시점에 따라 Confetti 위치와 개수를 다르게 설정 (1~4군데)
    function triggerConfetti(levelIdx) {
        const zone = document.getElementById('growth-zone');
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
        const shapes = ['●', '■', '▲', '★'];
        
        // levelIdx에 따라 터지는 지점 설정 (0: Student, 1: Doc, 2: Prof, 3: God)
        // 지점 개수: 1개, 2개, 3개, 4개 순으로 증가
        const spawnPoints = [
            { left: '50%', top: '50%' },                             // 1단계: 중앙
            { left: '30%', top: '50%' }, { left: '70%', top: '50%' }, // 2단계: 좌우
            { left: '20%', top: '60%' }, { left: '50%', top: '40%' }, { left: '80%', top: '60%' }, // 3단계: 삼각
            { left: '20%', top: '40%' }, { left: '80%', top: '40%' }, { left: '20%', top: '70%' }, { left: '80%', top: '70%' } // 4단계: 사방
        ];

        // 해당 레벨 인덱스에 맞는 지점들만 추출
        let activePoints = [];
        if (levelIdx === 0) activePoints = spawnPoints.slice(0, 1);
        else if (levelIdx === 1) activePoints = spawnPoints.slice(1, 3);
        else if (levelIdx === 2) activePoints = spawnPoints.slice(3, 6);
        else if (levelIdx === 3) activePoints = spawnPoints.slice(6, 10);

        activePoints.forEach(point => {
            for (let i = 0; i < 25; i++) { // 지점당 25개씩 생성
                const conf = document.createElement('div'); 
                conf.className = 'confetti'; 
                conf.innerText = pick(shapes); 
                conf.style.color = pick(colors);
                conf.style.fontSize = rand(12, 22) + 'px'; 
                conf.style.left = point.left;
                conf.style.top = point.top;
                
                const angle = Math.random() * Math.PI * 2;
                const vel = 80 + Math.random() * 150;
                
                conf.style.setProperty('--tx', Math.cos(angle) * vel + 'px'); 
                conf.style.setProperty('--ty', (Math.sin(angle) * vel + 50) + 'px'); 
                conf.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
                conf.style.animation = `confettiBurst ${1.0 + Math.random()}s cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;
                
                zone.appendChild(conf); 
                setTimeout(() => conf.remove(), 2000);
            }
        });
    }

    // checkAnswer 함수 내에서 해당 인덱스를 전달하도록 수정됨
    function checkAnswer() {
        if (!isPlaying) return;
        if (parseInt(inputStr) === currentAns) {
            score++;
            const t = DIFF_THRESHOLDS[currentDifficulty];
            const milestones = [t.student, t.doc, t.prof, t.god];
            
            // 몇 번째 마일스톤인지 확인하여 효과 차별화
            const mIdx = milestones.indexOf(score);
            if (mIdx !== -1) triggerConfetti(mIdx); 
            
            score % 5 === 0 ? triggerWatering() : triggerSunlight();
            document.getElementById('current-score').innerText = score;
            updateGrowthZone(); genQuestion();
        } else {
            document.getElementById('question-display').classList.add('wrong');
            document.getElementById('player-input').innerText = inputStr = "";
            setTimeout(() => document.getElementById('question-display').classList.remove('wrong'), 300);
        }
    }

    function updateGrowthZone() {
        const zone = document.getElementById('growth-zone'); zone.querySelectorAll('.growth-row').forEach(r => r.remove());
        let r1 = document.createElement('div'), r2 = document.createElement('div'); r1.className = r2.className = 'growth-row';
        if (score <= 11) { if (score >= 1) r2.innerHTML = `<div class="growth-item" style="font-size:${12+(score*2)}px;">🌰</div>`;
        } else if (score <= 19) { r2.innerHTML = `<div class="growth-item" style="font-size:${score>=14?24+(score-13):24}px;">🌱</div>`;
        } else if (score <= 25) { r2.innerHTML = `<div class="growth-item" style="font-size:${30+(score-20)*2}px;">🌳</div>`;
        } else {
            let s1 = new Array(11).fill(null), s2 = new Array(11).fill(null); s2[5] = '🌳';
            if (score >= 26) [6, 4, 7, 3].slice(0, score-25).forEach(p => s2[p] = '🌼');
            if (score >= 30) [8, 2, 10, 0].slice(0, Math.floor((Math.min(score,37)-30)/2)+1).forEach((p,i) => s2[p] = ['🐥','🐤','🐌','🐞'][i]);
            if (score === 38) { const e = document.createElement('div'); e.className='growth-item eagle-anim'; e.innerText='🦅'; e.style.fontSize='30px'; e.style.position='absolute'; e.style.top='10px'; zone.appendChild(e); setTimeout(() => e.remove(), 2000); }
            if (score >= 39) { for(let i=0; i <= Math.floor((score-39)/2); i++) s1[[2,8,5,1,9,4,7][i%7]] = ['🐝','🦋','🦅'][i%3]; }
            const render = (row, slots) => slots.forEach(item => { let d = document.createElement('div'); d.className = 'growth-item'; if (item) { d.innerText = item; d.style.fontSize = item==='🌳'?'40px':'24px'; } row.appendChild(d); });
            render(r1, s1); render(r2, s2);
        }
        zone.append(r1, r2);
    }

    function stopGame() { isGameOver = true; isPlaying = false; clearInterval(timerObj); document.getElementById('pop-title').innerText = getLvData(score).fullName; document.getElementById('pop-stats').innerText = `Score : ${score}`; document.getElementById('modal-overlay').style.display = 'flex'; }

    async function goToResult() {
        document.getElementById('modal-overlay').style.display = 'none'; showPage('result');
        const lv = getLvData(score); document.getElementById('res-lv-title').innerText = `${lv.emoji} ${lv.fullName}`; document.getElementById('res-random-msg').innerText = pick(MSG_LIB[lv.id]); document.getElementById('res-growth-display').innerHTML = "";
        document.getElementById('growth-zone').querySelectorAll('.growth-row').forEach(r => document.getElementById('res-growth-display').appendChild(r.cloneNode(true)));
        document.getElementById('res-score-msg').innerText = `You solved : ${score}`;
        const rMsg = document.getElementById('res-rank-msg'); rMsg.innerText = "Calculating rank...";
        try { const lastMon = new Date(); lastMon.setDate(lastMon.getDate() - (lastMon.getDay() === 0 ? 6 : lastMon.getDay() - 1)); lastMon.setHours(9,0,0,0); const snap = await db.collection('rankings').doc(currentDifficulty).collection('players').where('ts', '>=', lastMon.getTime()).get(); let all = []; snap.forEach(doc => all.push(doc.data())); all.sort((a,b) => b.score - a.score); const rank = all.findIndex(p => p.score <= score) + 1; rMsg.innerText = rank > 0 ? `You are ranked at ${rank}${getOrdinalSuffix(rank)}` : "Welcome to the leaderboard!"; } catch (e) { rMsg.innerText = ""; }
    }

    async function pushRank() {
        const btn = document.querySelector('.btn-submit'), nick = document.getElementById('nickname').value.trim() || "sprout";
        const oldText = btn.innerText; btn.disabled = true; btn.innerText = "Saving...";
        try { const now = Date.now(); lastPushTs = now; await db.collection('rankings').doc(currentDifficulty).collection('players').add({ name: nick, score: score, lv: getLvData(score).fullName, date: new Date().toISOString().split('T')[0], ts: now }); viewRankings(currentDifficulty); alert("Rank saved successfully!"); } catch (e) { alert("Error saving score."); btn.disabled = false; btn.innerText = oldText; }
    }

    async function viewRankings(mode = 'cake') {
        showPage('rank'); document.getElementById('rank-mode-label').innerText = {cake:"🍰 Piece of Cake", pepper:"🌶️ Hot Pepper", volcano:"🌋 Spicy Volcano"}[mode] + " Ranking";
        document.querySelectorAll('.rank-tab-btn').forEach(b => b.classList.toggle('active-mode', b.id === `btn-rank-${mode}`));
        const lastMon = new Date(); lastMon.setDate(lastMon.getDate() - (lastMon.getDay() === 0 ? 6 : lastMon.getDay() - 1)); lastMon.setHours(9,0,0,0);
        try { 
            const snap = await db.collection('rankings').doc(mode).collection('players').where('ts', '>=', lastMon.getTime()).get(); 
            let rows = []; snap.forEach(doc => rows.push(doc.data())); 
            rows.sort((a,b) => b.score - a.score); 
            document.getElementById('rank-list').innerHTML = rows.slice(0, 50).map((r, i) => { 
                const lv = getLvData(r.score, mode); 
                const isMe = r.ts === lastPushTs; 
                // 4. Date format MM/DD로 변경
                const dateObj = new Date(r.ts);
                const mmdd = String(dateObj.getMonth() + 1).padStart(2, '0') + '/' + String(dateObj.getDate()).padStart(2, '0');
                return `<tr ${isMe ? 'id="my-row"' : ''} class="${lv?.class} ${isMe ? 'my-rank-highlight' : ''}"><td>${i+1}</td><td>${lv?.emoji} ${r.name}</td><td>${r.score}</td><td>${r.score>0?(60/r.score).toFixed(2):'0.00'}s</td><td>${mmdd}</td></tr>`; 
            }).join('') || "<tr><td colspan='5'>No rankings yet.</td></tr>"; 
            if (document.getElementById('my-row')) document.getElementById('rank-scroll-container').scrollTop = document.getElementById('my-row').offsetTop - 100; 
        } catch (e) { console.error(e); }
    }

    const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const getOrdinalSuffix = (i) => { let j = i%10, k = i%100; return (j==1&&k!=11)?"st":(j==2&&k!=12)?"nd":(j==3&&k!=13)?"rd":"th"; };
    function triggerWatering() { const z = document.getElementById('growth-zone'); for(let i=0; i<6; i++) { const d = document.createElement('div'); d.className='water-drop'; d.innerText='💧'; d.style.left=Math.random()*90+5+'%'; z.appendChild(d); setTimeout(()=>d.remove(), 800); } }
    function triggerSunlight() { const z = document.getElementById('growth-zone'); const s = document.createElement('div'); s.className='fixed-sun'; s.innerText='☀️'; s.style.left=(15+(score%5-1)*20)+'%'; z.appendChild(s); setTimeout(()=>s.remove(), 800); for(let i=0;i<8;i++){ const p=document.createElement('div'); p.className='sparkle'; p.innerText='✨'; p.style.left=Math.random()*90+5+'%'; p.style.top=Math.random()*80+10+'%'; z.appendChild(p); setTimeout(()=>p.remove(),600); } }
    window.addEventListener('keydown', (e) => { if(!isNaN(e.key)) handleInput(parseInt(e.key)); else if(e.key === 'Backspace' || e.key === 'Delete') handleInput('del'); });
</script>
</body>
